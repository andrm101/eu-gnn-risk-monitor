name: eu-gnn-risk
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas=2.2
  - pyarrow=15
  - numpy=1.26
  - scikit-learn=1.4
  - pytest=8.1
  - pytest-cov
  - jupyter
  - ipykernel
  - requests=2.32
  - geopandas=0.14
  - pyogrio=0.7
  - pip
  - pip:
    - --index-url https://download.pytorch.org/whl/cpu
    - torch==2.9.0+cpu
    - torch-geometric==2.5.3
